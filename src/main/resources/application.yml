spring:
  application:
    name: pik-server
  config:
    import: optional:file:.env.local[.properties]
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # No static content; unknown paths become NoHandlerFoundException instead of a resource lookup log.
      add-mappings: false
  mvc:
    apiversion:
      use:
        header: API-Version
      supported: 1
  datasource:
    hikari:
      # PostgreSQL's default, pinned: IdempotentExecutor must see records committed while it waited for the key lock.
      # Hikari only applies transaction-isolation when it differs from the default it read on its first connection,
      # so each new connection also sets it, in case the database default changes later.
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL READ COMMITTED
      data-source-properties:
        # PostgreSQL error details can echo column values into exception messages.
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  modulith:
    events:
      # Completed publications carry owner and photo IDs; delete them instead of defining a retention rule.
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: false

pik:
  idempotency:
    retention: P7D
    lock-timeout: PT3S
    # Short so that instances restarted more often than the interval still clean up; ShedLock prevents overlap.
    cleanup-initial-delay: PT1M
    cleanup-interval: PT1H
    cleanup-batch-size: 1000
  security:
    jwt:
      issuer: pik-server
      access-token-ttl: PT15M
      clock-skew: PT60S
      # JWK set JSON: the current ES256 key with its private part, previous keys public only (ADR-0027).
      # Empty only in the local and test profiles, which then sign with an ephemeral key.
      jwk-set: ${PIK_SECURITY_JWT_JWK_SET:}
  account:
    last-seen-interval: P1D
  consent:
    ai:
      # Notice served with the consent state (classpath:consent/ai-notice-v<N>.json); new consents must be given on it.
      notice-version: 1
      # Consents given on older notices no longer count. Raise it only when the transfers widen (ADR-0028 #4).
      minimum-notice-version: 1
  usage:
    trial:
      # Photos, representatives and members together, analyzed free once per principal and device (FR-B-01, P01).
      limit: 100
    # HMAC keys for Android device IDs: "<version>:<base64 key>" entries separated by commas, at least 32 bytes each.
    # The highest version hashes new devices. Empty only in the local and test profiles, which use an ephemeral key.
    device-keys: ${PIK_USAGE_DEVICE_KEYS:}
  analysis:
    # POST /analysis-jobs stays off until stages 5-1 to 5-3 are merged and the listener tests pass (design 4.4).
    intake-enabled: false
    intake:
      # Deadlines fixed on new jobs (design 2.2).
      upload-deadline: PT24H
      processing-deadline: PT48H
      # Request bodies above it are refused before they are parsed: 2 MiB, 2,097,152 bytes (design 1.1, Q16).
      max-body-size: 2MB
    grouping:
      # Off: vectors are only checked for structure, none is stored and every photo is single (design 1.4).
      enabled: false
      # Grouping rule v1 (design 1.3, P05). Any change of a grouping value gives a new rule version.
      window: PT120S
      max-group-size: 20
      zero-norm-epsilon: 1e-6
      # Registered vector models: model and model-version (1 to 64 visible ASCII characters), dims (1 to 2250)
      # and threshold θ in (0, 1), each (model, model-version) once. Must not be empty when grouping is enabled.
      models: []
    manifest:
      # Call manifest fixed on new jobs (design 2.5, plan 6.1). Any change of a value, or of the prompt or schema
      # resource it names, gives a new manifest ID. The values are settled with the D-07 measurements.
      model: claude-haiku-5-5
      content-type: image/jpeg
      max-bytes: 2097152
      max-long-edge-px: 1568
      # Every image within max-long-edge-px: 1568 x 1568.
      max-pixels: 2458624
      # classpath:analysis/prompt/v1/system.md and classpath:analysis/schema/v1.json.
      prompt: v1
      schema-version: 1
      # Thinking tokens count toward max-tokens; 1,024 could cut the JSON (K-16). D-07 compares thinking disabled
      # with max-tokens 2048.
      thinking: adaptive
      effort: low
      max-tokens: 4096
      # Development defaults, to be measured (D-07). Image: the most visual tokens of one image on current models.
      # Prompt: system prompt, the tokens the output schema adds and the instruction text, with a wide margin.
      image-token-cap: 4784
      prompt-token-cap: 8000
      cache:
        enabled: true
        ttl: PT5M
      output-locale: ko-KR
      # Claude Haiku 5.5 up to 100K prompt tokens: input $0.10, output $0.50 per million tokens; 5-minute cache
      # writes 1.25 x input, cache reads 0.1 x input. Maximum cost of a call with these values: 3,527 micro dollars.
      price:
        version: claude-haiku-5-5-2026-11
        input-micros-per-mtok: 100000
        cache-write-micros-per-mtok: 125000
        cache-read-micros-per-mtok: 10000
        output-micros-per-mtok: 500000
      # IDs of earlier manifests that jobs fixed before a change still run with (their resources must stay).
      previous-ids: []
    # Values marked "development default" are conservative placeholders. Their production values are an owner
    # decision, made before intake is enabled.
    upload:
      # An attempt's URL expires at min(issue + url-ttl, upload deadline) (design 2.2, 2.3).
      url-ttl: PT15M
      confirm-grace: PT15M
      max-attempts: 5
      # Uploads started before the URL expired may end this much later; deletes before that are not final (R2-06).
      in-flight-margin: PT30M
      # Retry-After of a confirmation that finds no object yet.
      not-found-retry-after: PT5S
      # HEAD, GET and DELETE run outside transactions with the SDK standard retries, each attempt and the whole call
      # bounded.
      storage-call-timeout: PT10S
      storage-attempt-timeout: PT3S
      # Required. Credentials come from the AWS SDK default chain (the ECS task role when deployed).
      bucket: ${PIK_ANALYSIS_BUCKET:}
      region: ${AWS_REGION:}
      # endpoint: S3Mock only, set by the local and test profiles.
    worker:
      # Only the worker service turns it on (plan 5.1).
      enabled: false
      poll-interval: PT1S
      # Development default.
      global-slots: 2
      principal-slots: 4
      claim-oversample: 4
      claim-rounds: 3
      # lease > send-margin > claude.request-timeout (design 2.2).
      lease: PT120S
      send-margin: PT70S
    claude:
      request-timeout: PT60S
      # Not a secret: operators change it when they replace the API key or release the configuration circuit.
      key-version: "1"
      # Required when the worker is enabled. Deployed: ECS task secrets from SSM Parameter Store.
      api-key: ${ANTHROPIC_API_KEY:}
      # base-url: a fake server only, set by the test profile.
    send-rate:
      # Development defaults. Each instance sends at most global-per-second / max-instances (design 2.7).
      global-per-second: 1
      max-instances: 2
    budget:
      # Development default: 1 USD per KST day.
      daily-cost-limit-micros: 1000000
      principal-daily-sends: 300
      photo-lifetime-sends: 3
      # Trial devices send at most trial limit × multiplier.
      device-send-multiplier: 2
    input:
      invalid-threshold: 3
      block-duration: PT24H
    input-rate:
      # Development defaults, to be measured (design 2.7).
      principal-items-per-hour: 300
      principal-bytes-per-hour: 600MB
      trial-items-per-hour: 100
      trial-bytes-per-hour: 200MB
    circuit:
      # Development defaults for the configuration (400 share) and transient circuits (design 2.5).
      bad-request-ratio: 0.2
      window: PT10M
      min-samples: 20
      transient-threshold: 5
      transient-base-backoff: PT30S
      transient-max-backoff: PT10M
      probe-exclusion: PT10M
      half-open-alarm: PT30M
    cleanup:
      # The upload batches run on every instance; ShedLock lets one instance run each at a time (plan 7).
      initial-delay: PT1M
      recovery-interval: PT5M
      delete-interval: PT1M
      reconcile-interval: PT6H
      overdue-alarm: PT6H
      rate-window-interval: PT1H
      batch-size: 500
    poll:
      after-running: PT3S
      jitter: 0.2

# Field allow list from ADR-0023 #9; anything else (thread, MDC extras, request data) is dropped.
logging:
  level:
    # Malformed request lines are logged at INFO with the raw request target (may contain search terms).
    org.apache.coyote.http11.Http11Processor: WARN
    # Repeats filter exceptions with getMessage() and no trace_id; RequestLoggingFilter already logs them.
    "[org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]]": OFF
  structured:
    format:
      console: logstash
    json:
      include:
        - "@timestamp"
        - level
        - logger_name
        - message
        - stack_trace
        - trace_id
        - principal_id
        - action
        - target_id
        - status
        - reason
        - http_status
        - duration_ms
      stacktrace:
        printer: io.github.gb6105.pik.shared.logging.MessageFreeStackTracePrinter
