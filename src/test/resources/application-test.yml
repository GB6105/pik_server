# Tests that import S3MockConfiguration replace the endpoint and the bucket with their S3Mock container. The others get
# a closed local port, so that no test reaches AWS.
pik:
  analysis:
    upload:
      bucket: pik-analysis-test
      region: us-east-1
      endpoint: http://127.0.0.1:1
    # Tests call the upload batches directly; scheduled runs would change the rows of the test that is running.
    cleanup:
      initial-delay: P3650D
